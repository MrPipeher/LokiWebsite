<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled — Loki HUD</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-primary: #07090e;
      --bg-card: rgba(18, 24, 38, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .status-card {
      position: relative;
      z-index: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .status-icon-box {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent-gold);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .status-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      box-shadow: 0 4px 20px var(--accent-gold-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
    .cancel-notice {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="status-card">
    <div class="status-icon-box">
      <i class="ph-bold ph-arrow-counter-clockwise"></i>
    </div>

    <h1>Checkout Cancelled</h1>
    <p>
      Your transaction was stopped and <strong>no charges were made</strong>. You can return to choose a plan or join our Discord if you need assistance.
    </p>

    <div class="status-actions">
      <!-- Directly links to your website domain -->
      <a href="https://loki.live/#pricing" class="btn btn-primary">
        <i class="ph-bold ph-shopping-bag-open"></i> Return to Pricing Plans
      </a>
      <a href="https://discord.gg/fab9WUG39U" target="_blank" class="btn btn-outline">
        <i class="ph-bold ph-discord-logo"></i> Join Discord for Help
      </a>
    </div>

    <div class="cancel-notice">
      <i class="ph-bold ph-shield-check"></i> 100% Encrypted & Safe &bull; No payment data stored
    </div>
  </div>

</body>
</html>
